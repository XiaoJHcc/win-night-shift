[package]
name = "win-night-shift"
version = "0.1.0"
edition = "2021"
description = "常驻托盘的 Windows 小工具：夜间模式开关/强度拉条 + 亮暗模式切换，WinUI 3 托盘浮窗"

[dependencies]
tray-icon = "0.19"
# 运行时解码 include_bytes! 内嵌的托盘 .ico（见 src/tray.rs）。
ico = "0.4"

[dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_ColorSystem",
    "Win32_UI_Magnification",
]

# WinUI 3 投影：调用系统已装的 WindowsAppRuntime 框架包，不引入 .NET。
# crates.io 上发布的 winio-winui3 0.4.5 缺 UI_Xaml_Hosting 等 feature，只能用 upstream。
[dependencies.winui3]
git = "https://github.com/compio-rs/winui3-rs"
features = [
    "UI_Input",
    "UI_Xaml",
    "UI_Xaml_Controls",
    "UI_Xaml_Controls_Primitives",
    "UI_Xaml_Input",
    "UI_Xaml_Media",
    "UI_Xaml_Media_Animation",
    "UI_Xaml_Hosting",
    "UI_Composition",
    "UI_Dispatching",
    "UI_Windowing",
    "XamlApp",
]

[build-dependencies]
winresource = "0.1"

# 仅供 examples/makeicon.rs（一次性图标生成器）使用，不进正式二进制。
[dev-dependencies]
resvg = { version = "0.45", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
